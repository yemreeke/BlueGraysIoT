name=BlueGraysIoT
version=0.1.0
author=Yunus Emre Eke <info@bluegrays.com>
maintainer=BlueGrays <info@bluegrays.com>
sentence=Control ESP32 and Raspberry Pi Pico W boards from the BlueGrays app over a secure WebSocket.
paragraph=Switches, sliders, colors and live sensor values with charts in the BlueGrays mobile app. TLS with bundled root certificates, automatic Wi-Fi and server reconnects, rate limiting and state restore after a power cut. The BlueGrays app generates the code. The device key travels only in the connection header and is never printed.
category=Communication
url=https://bluegrays.com
architectures=esp32,rp2040
depends=WebSockets (>=2.6.0), ArduinoJson (>=7.0.0), DHT sensor library
includes=BlueGraysIoT.h
